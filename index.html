  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:         #07090f;
      --sidebar:    #0c1120;
      --surface:    #101827;
      --surface2:   #192236;
      --border:     #1e3050;
      --accent:     #2563eb;
      --accent-h:   #3b82f6;
      --glow:       rgba(37,99,235,.25);
      --text:       #e2e8f0;
      --muted:      #5a7498;
      --dim:        #8ba3c0;
      --green:      #22c55e;
      --amber:      #f59e0b;
    }

    html, body { height: 100%; overflow: hidden; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      font-size: 14px;
    }

    ::-webkit-scrollbar          { width: 5px; height: 5px; }
    ::-webkit-scrollbar-track    { background: transparent; }
    ::-webkit-scrollbar-thumb    { background: var(--border); border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: var(--accent); }

    /* ── Layout ─────────────────────────────────── */
    .app  { display: flex; flex-direction: column; height: 100vh; }
    .body { display: flex; flex: 1; overflow: hidden; }
    .main { flex: 1; overflow: auto; padding: 24px 28px; }

    /* ── Header ──────────────────────────────────── */
    .header {
      height: 52px;
      display: flex;
      align-items: center;
      padding: 0 20px;
      background: var(--sidebar);
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
      gap: 14px;
    }
    .logo       { font-weight: 800; font-size: 14px; letter-spacing: 2.5px; color: var(--accent-h); text-transform: uppercase; }
    .logo-sep   { width: 1px; height: 18px; background: var(--border); }
    .logo-sub   { font-size: 12px; color: var(--muted); letter-spacing: .3px; }
    .hdr-right  { margin-left: auto; display: flex; align-items: center; gap: 10px; }

    .search-box {
      display: flex; align-items: center; gap: 7px;
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 7px; padding: 5px 11px; width: 220px;
      transition: border-color .15s, box-shadow .15s;
    }
    .search-box:focus-within {
      border-color: var(--accent-h);
      box-shadow: 0 0 0 3px var(--glow);
    }
    .search-box svg   { color: var(--muted); flex-shrink: 0; }
    .search-box input { background: none; border: none; outline: none; color: var(--text); font-size: 12.5px; width: 100%; }
    .search-box input::placeholder { color: var(--muted); }
    .clear-btn { cursor: pointer; color: var(--muted); font-size: 11px; line-height: 1; }
    .clear-btn:hover { color: var(--text); }

    /* ── Sidebar ─────────────────────────────────── */
    .sidebar {
      width: 176px;
      background: var(--sidebar);
      border-right: 1px solid var(--border);
      flex-shrink: 0;
      padding: 20px 0;
      overflow-y: auto;
    }
    .sb-label {
      font-size: 9.5px; font-weight: 700; letter-spacing: 1.8px;
      text-transform: uppercase; color: var(--muted); padding: 0 14px 10px;
    }
    .rb {
      display: flex; align-items: center; gap: 9px;
      width: 100%; padding: 9px 14px;
      background: none; border: none; border-left: 2px solid transparent;
      color: var(--dim); font-size: 12.5px;
      cursor: pointer; text-align: left;
      transition: background .12s, color .12s;
    }
    .rb:hover           { background: var(--surface2); color: var(--text); }
    .rb.active          { background: var(--surface2); color: var(--accent-h); border-left-color: var(--accent-h); font-weight: 600; }
    .rb-flag            { font-size: 15px; }
    .rb-count           { margin-left: auto; font-size: 10px; padding: 1px 5px; border-radius: 8px; background: var(--surface); color: var(--muted); }
    .rb.active .rb-count { background: var(--glow); color: var(--accent-h); }

    /* ── Stats bar ───────────────────────────────── */
    .stats { display: flex; gap: 14px; margin-bottom: 24px; flex-wrap: wrap; }
    .sc {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 10px; padding: 12px 18px; min-width: 90px;
    }
    .sc-val { font-size: 22px; font-weight: 800; color: var(--accent-h); line-height: 1; }
    .sc-lbl { font-size: 10.5px; color: var(--muted); margin-top: 4px; letter-spacing: .3px; }
    .sc.wide { flex: 1; }
    .sc.wide .sc-val { font-size: 14px; font-weight: 700; }

    /* ── Org chart ───────────────────────────────── */
    .chart-root { display: inline-flex; flex-direction: column; align-items: center; padding-bottom: 40px; }

    .nw { display: flex; flex-direction: column; align-items: center; }

    .nc {
      padding: 9px 13px; border-radius: 8px;
      text-align: center; position: relative;
      transition: transform .15s, box-shadow .15s;
      min-width: 140px; max-width: 196px;
      user-select: none;
    }
    .nc.clickable { cursor: pointer; }
    .nc.clickable:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(0,0,0,.5), 0 0 0 1px var(--accent); }

    .nn { font-size: 11.5px; font-weight: 700; color: #fff; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .nt { font-size: 9.5px; color: rgba(255,255,255,.5); margin-top: 2px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

    .nb {
      position: absolute; bottom: -9px; left: 50%; transform: translateX(-50%);
      font-size: 9px; font-weight: 700; padding: 1px 6px; border-radius: 10px;
      white-space: nowrap; z-index: 1; color: #fff;
    }

    /* Level colours */
    .l0 { background: linear-gradient(145deg,#1d3f8f,#2558d0); border: 1px solid #3b7ef0; box-shadow: 0 0 24px rgba(37,99,235,.35); min-width: 180px; }
    .l1 { background: linear-gradient(145deg,#162a54,#1c3565); border: 1px solid #24539f; }
    .l2 { background: linear-gradient(145deg,#0f1e3a,#142444); border: 1px solid #1b3060; }
    .l3 { background: linear-gradient(145deg,#0a1525,#0e1e33); border: 1px solid #162a48; }
    .l4 { background: #080f1e; border: 1px solid #111e35; }

    .stag { background: linear-gradient(145deg,#0a1e10,#0c2613) !important; border-color: #155128 !important; }
    .stag .nt { color: #4ade80 !important; }

    .hit { border-color: var(--amber) !important; box-shadow: 0 0 14px rgba(245,158,11,.35) !important; }
    .hit .nn { color: var(--amber); }

    /* Connectors */
    .vl { width: 2px; height: 20px; background: var(--border); }

    .cr { display: flex; padding-top: 20px; }

    .cs {
      display: flex; flex-direction: column; align-items: center;
      position: relative; padding: 0 7px;
    }
    /* horizontal bar */
    .cs::before {
      content: ''; position: absolute;
      top: 0; left: 0; right: 0;
      border-top: 2px solid var(--border);
    }
    .cs:first-child::before { left: 50%; }
    .cs:last-child::before  { right: 50%; }
    .cs:only-child::before  { display: none; }
    /* vertical drop */
    .cs::after {
      content: ''; position: absolute;
      top: 0; left: 50%; transform: translateX(-50%);
      width: 2px; height: 20px; background: var(--border);
    }

    @keyframes fadeDown {
      from { opacity: 0; transform: translateY(-6px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .fade-in { animation: fadeDown .18s ease; }

    /* ── Empty state ─────────────────────────────── */
    .empty { text-align: center; color: var(--muted); padding: 60px 20px; font-size: 13px; }
    .empty svg { margin-bottom: 12px; opacity: .3; }
  </style>
</head>

/* ================================================================
   HELPERS
================================================================ */
function countNodes(node) {
  if (!node) return 0;
  return 1 + (node.children || []).reduce((s, c) => s + countNodes(c), 0);
}
function maxDepth(node) {
  if (!node) return 0;
  const kids = node.children || [];
  if (!kids.length) return 0;
  return 1 + Math.max(...kids.map(maxDepth));
}
function countInterns(node) {
  if (!node) return 0;
  const self = /stagiaire/i.test(node.title || '') ? 1 : 0;
  return self + (node.children || []).reduce((s, c) => s + countInterns(c), 0);
}

/* ================================================================
   OrgNode
================================================================ */
function OrgNode({ node, level, search }) {
  const kids = node.children || [];
  const hasKids = kids.length > 0;
  const [open, setOpen] = useState(level < 2);

  const q = search.trim().toLowerCase();
  const isStag = /stagiaire/i.test(node.title || '');
  const isHit  = q && (
    node.name.toLowerCase().includes(q) ||
    (node.title || '').toLowerCase().includes(q)
  );
  const show = q ? true : open;

  const lvl = 'l' + Math.min(level, 4);

  return (
    <div className="nw">
      <div
        className={`nc ${lvl}${isStag ? ' stag' : ''}${isHit ? ' hit' : ''}${hasKids ? ' clickable' : ''}`}
        title={node.name + (node.title ? '\n' + node.title : '')}
        onClick={() => hasKids && setOpen(o => !o)}
      >
        <div className="nn">{node.name}</div>
        {node.title && <div className="nt">{node.title}</div>}
        {hasKids && !q && (
          <div className="nb" style={{ background: open ? '#1e3a8a' : '#2563eb' }}>
            {open ? '▴' : `▾ ${kids.length}`}
          </div>
        )}
      </div>

      {hasKids && show && (
        <>
          <div className="vl" />
          <div className="cr fade-in">
            {kids.map((child, i) => (
              <div key={i} className="cs">
                <OrgNode node={child} level={level + 1} search={search} />
              </div>
            ))}
          </div>
        </>
      )}
    </div>
  );
}

}
